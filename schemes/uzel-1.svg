<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1000" height="900" fill="#0d1117" rx="16"/>
  
  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#f0f6fc" font-size="22" font-weight="700">УЗЕЛ 1 — Получение вводных данных по проекту</text>
  <text x="500" y="68" text-anchor="middle" fill="#8b949e" font-size="13">Тип: Расходящийся · Один сырой вход → Структурированный артефакт</text>
  
  <!-- Природа -->
  <rect x="50" y="95" width="900" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="500" y="125" text-anchor="middle" fill="#8b949e" font-size="13">
    <tspan font-weight="600" fill="#f0f6fc">Природа:</tspan> Один сырой вход → 4 микро-агента → Структурированный артефакт + список открытых вопросов
  </text>
  
  <!-- Обязательное условие -->
  <rect x="50" y="155" width="900" height="40" rx="8" fill="#f778ba15" stroke="#f778ba" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="500" y="180" text-anchor="middle" fill="#f778ba" font-size="12">
    <tspan font-weight="600">Обязательное условие:</tspan> Должен быть <tspan font-weight="600">эталон</tspan> — заранее известный список того, что должно быть собрано
  </text>
  
  <!-- ====== ВХОД ====== -->
  <rect x="400" y="220" width="200" height="50" rx="10" fill="#1f6feb20" stroke="#1f6feb" stroke-width="2"/>
  <text x="500" y="242" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="600">Сырой вход</text>
  <text x="500" y="260" text-anchor="middle" fill="#8b949e" font-size="11">Письмо / звонок / бриф клиента</text>
  
  <!-- Стрелка к эталону -->
  <line x1="500" y1="270" x2="500" y2="300" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- ====== ЭТАЛОН ====== -->
  <rect x="150" y="300" width="700" height="50" rx="10" fill="#d2a8ff15" stroke="#d2a8ff" stroke-width="2"/>
  <text x="500" y="322" text-anchor="middle" fill="#d2a8ff" font-size="13" font-weight="600">ЭТАЛОН — Шаблон сбора вводных</text>
  <text x="500" y="340" text-anchor="middle" fill="#8b949e" font-size="11">Категории: ЦА · Цель сайта · Отличие · Тон · География · Бюджет · Сроки · Конкуренты</text>
  
  <!-- Стрелка от эталона к микро-агентам -->
  <line x1="500" y1="350" x2="500" y2="390" stroke="#6e7681" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- ====== 4 МИКРО-АГЕНТА ====== -->
  <!-- Шаг 1 -->
  <rect x="50" y="410" width="220" height="110" rx="10" fill="#1f6feb15" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="160" y="440" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="600">Шаг 1</text>
  <text x="160" y="460" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="500">Структурировать сырое</text>
  <line x1="70" y1="475" x2="250" y2="475" stroke="#1f6feb33" stroke-width="1"/>
  <text x="160" y="495" text-anchor="middle" fill="#8b949e" font-size="11">Применить эталон к сырым</text>
  <text x="160" y="513" text-anchor="middle" fill="#8b949e" font-size="11">вводным</text>
  
  <!-- Шаг 2 -->
  <rect x="290" y="410" width="220" height="110" rx="10" fill="#1f6feb15" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="400" y="440" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="600">Шаг 2</text>
  <text x="400" y="460" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="500">Найти дыры</text>
  <line x1="310" y1="475" x2="490" y2="475" stroke="#1f6feb33" stroke-width="1"/>
  <text x="400" y="495" text-anchor="middle" fill="#8b949e" font-size="11">Сравнить с эталоном,</text>
  <text x="400" y="513" text-anchor="middle" fill="#8b949e" font-size="11">выявить неясности</text>
  
  <!-- Шаг 3 -->
  <rect x="530" y="410" width="220" height="110" rx="10" fill="#1f6feb15" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="640" y="440" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="600">Шаг 3</text>
  <text x="640" y="460" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="500">Спланировать закрытие</text>
  <line x1="550" y1="475" x2="730" y2="475" stroke="#1f6feb33" stroke-width="1"/>
  <text x="640" y="495" text-anchor="middle" fill="#8b949e" font-size="11">Планируем: через клиента</text>
  <text x="640" y="513" text-anchor="middle" fill="#8b949e" font-size="11">или через исследование</text>
  
  <!-- Шаг 4 -->
  <rect x="770" y="410" width="220" height="110" rx="10" fill="#1f6feb15" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="880" y="440" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="600">Шаг 4</text>
  <text x="880" y="460" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="500">Закрыть дыры</text>
  <line x1="790" y1="475" x2="970" y2="475" stroke="#1f6feb33" stroke-width="1"/>
  <text x="880" y="495" text-anchor="middle" fill="#8b949e" font-size="11">Вопросы клиенту /</text>
  <text x="880" y="513" text-anchor="middle" fill="#8b949e" font-size="11">Отдельные исследования</text>
  
  <!-- Стрелки между шагами -->
  <line x1="270" y1="465" x2="288" y2="465" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="465" x2="528" y2="465" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="465" x2="768" y2="465" stroke="#30363d" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Стрелки к выходу -->
  <line x1="160" y1="520" x2="250" y2="580" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="520" x2="400" y2="580" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="520" x2="640" y2="580" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="880" y1="520" x2="750" y2="580" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- ====== ВЫХОД ====== -->
  <rect x="250" y="580" width="500" height="70" rx="10" fill="#23863620" stroke="#238636" stroke-width="2"/>
  <text x="500" y="608" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="600">СТРУКТУРИРОВАННЫЙ АРТЕФАКТ</text>
  <text x="500" y="630" text-anchor="middle" fill="#8b949e" font-size="12">Заполненный бриф по эталону + Список открытых вопросов</text>
  
  <!-- ====== ПРИМЕР ИЗ СТУДИИ ====== -->
  <rect x="50" y="680" width="900" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="500" y="705" text-anchor="middle" fill="#8b949e" font-size="12" font-weight="600">ПРИМЕР ИЗ СТУДИИ ДЕНИСА — «Бриф-аналитик»</text>
  
  <text x="150" y="735" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600">ВХОД</text>
  <text x="150" y="755" text-anchor="middle" fill="#8b949e" font-size="10">Письмо клиента</text>
  <text x="150" y="770" text-anchor="middle" fill="#8b949e" font-size="10">«Хочу сайт для кофейни»</text>
  
  <text x="350" y="735" text-anchor="middle" fill="#d2a8ff" font-size="11" font-weight="600">ЭТАЛОН</text>
  <text x="350" y="755" text-anchor="middle" fill="#8b949e" font-size="10">ЦА · Цель · Отличие · Тон · География</text>
  <text x="350" y="770" text-anchor="middle" fill="#8b949e" font-size="10">(5 категорий)</text>
  
  <text x="550" y="735" text-anchor="middle" fill="#f0f6fc" font-size="11" font-weight="600">4 МИКРО-АГЕНТА</text>
  <text x="550" y="755" text-anchor="middle" fill="#8b949e" font-size="10">Структурировать → Найти дыры → Спланировать → Закрыть</text>
  <text x="550" y="770" text-anchor="middle" fill="#8b949e" font-size="10">(4 шага по рамке типа)</text>
  
  <text x="750" y="735" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">ВЫХОД</text>
  <text x="750" y="755" text-anchor="middle" fill="#8b949e" font-size="10">Заполненный бриф +</text>
  <text x="750" y="770" text-anchor="middle" fill="#8b949e" font-size="10">Список открытых вопросов</text>
  
  <!-- Стрелки внутри примера -->
  <line x1="200" y1="755" x2="345" y2="755" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="755" x2="545" y2="755" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="755" x2="745" y2="755" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- ====== РАЗМЕТКА ====== -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>
