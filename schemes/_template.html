<body>
  <iframe id="f"></iframe>
  <script>
    const xml = `{{XML}}`;
    const blob = new Blob([xml], {type: 'text/xml'});
    const url = URL.createObjectURL(blob);
    document.getElementById('f').src =
      'https://embed.diagrams.net/?scrollbars=1&highlight=0000FF&edit=_blank&layers=1&navigation=1&editUrl=none&embedded=1&src=' + encodeURIComponent(url);
